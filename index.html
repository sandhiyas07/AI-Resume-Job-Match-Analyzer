<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume & Job Match Analyzer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>AI Resume & Job Match Analyzer</h1>
            <p>Analyze your resume against a job description using Gemini AI</p>
        </header>

        <main class="card">

            <form id="resumeForm">

                <div class="form-group">
                    <label for="resume">
                        Upload Resume PDF
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="job_description">
                        Job Description
                    </label>

                    <textarea
                        id="job_description"
                        name="job_description"
                        rows="10"
                        placeholder="Paste the job description here..."
                        required
                    ></textarea>
                </div>

                <button type="submit" id="analyzeButton">
                    Analyze Resume
                </button>

            </form>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Analyzing your resume with Gemini AI...</p>
            </div>

            <div id="errorMessage" class="error hidden"></div>

            <section id="resultSection" class="result hidden">

                <h2>AI Analysis Result</h2>

                <div id="resultContent"></div>

            </section>

        </main>

        <footer>
            <p>AI Resume & Job Match Analyzer</p>
        </footer>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
